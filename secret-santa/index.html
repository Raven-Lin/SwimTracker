<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Secret Santa Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
  /* One light look on every device, regardless of dark mode. */
  :root {
    color-scheme: light;
    --ground: #fff8f7;
    --ground-2: #fde3e1;
    --ink: #2b2226;
    --muted: #7a6a6e;
    --line: #f3c9c6;
    --field: #ffffff;
    --accent: #d6313f;
    --accent-ink: #ffffff;
    --accent-2: #b8283a;
    --accent-2-soft: #fdeceb;
    --tag: #ffffff;
    --tag-2: #ffeceb;
    --tag-ink: #3b2a2e;
    --string: #d6313f;
    --error: #d6313f;
    --display: "Gloock", "Noto Serif SC", "Songti SC", Georgia, serif;
    --body: "Figtree", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 10%, var(--ground-2) 0 2px, transparent 3px) 0 0 / 46px 46px,
      radial-gradient(circle at 70% 60%, var(--ground-2) 0 1.5px, transparent 2.5px) 0 0 / 33px 33px,
      var(--ground);
    color: var(--ink);
    font: 16px/1.55 var(--body);
    padding-inline: 16px;
    padding-block: 40px 56px;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    display: grid;
    gap: 28px;
  }

  header { display: grid; gap: 6px; text-align: center; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent-2);
  }
  h1 {
    font: 400 clamp(38px, 10vw, 52px)/1.05 var(--display);
    margin: 0; text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); }

  /* The gift tag */
  .tag-wrap {
    position: relative; padding-top: 34px;
    filter: drop-shadow(0 0 1px rgba(214,49,63,.55)) drop-shadow(0 10px 18px rgba(214,49,63,.16));
  }
  .string {
    position: absolute; left: 50%; top: 0; width: 2px; height: 46px;
    background: var(--string); transform: translateX(-50%); border-radius: 2px;
  }
  .tag {
    position: relative;
    background: linear-gradient(170deg, var(--tag), var(--tag-2));
    color: var(--tag-ink);
    padding: 44px 24px 28px;
    clip-path: polygon(50% 0, 100% 16%, 100% 100%, 0 100%, 0 16%);
    border-radius: 4px;
    display: grid; gap: 18px;
    min-height: 300px;
  }
  .tag::before {
    content: ""; position: absolute; left: 50%; top: 22px;
    width: 16px; height: 16px; border-radius: 50%;
    transform: translateX(-50%);
    background: var(--ground);
    box-shadow: inset 0 0 0 3px var(--accent-2);
  }
  .tag-label {
    font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    text-align: center; opacity: .75; margin-top: 8px;
  }

  form { display: grid; gap: 12px; }
  label { font-weight: 600; font-size: 15px; }
  label span { font-weight: 400; opacity: .75; }
  input {
    width: 100%; font: 500 20px/1.2 var(--body);
    padding: 14px 16px; border-radius: 10px;
    border: 2px solid #f3c9c6; background: var(--field); color: var(--ink);
  }
  input:focus-visible { outline: none; border-color: var(--accent); }
  button {
    font: 600 17px/1 var(--body); cursor: pointer;
    padding: 16px 18px; border-radius: 10px; border: 0;
    background: var(--accent); color: var(--accent-ink);
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .ghost {
    background: var(--accent-2-soft); color: var(--accent-2);
    border: 2px solid var(--accent-2);
  }
  .error {
    margin: 0; font-size: 14px; color: var(--tag-ink);
    background: color-mix(in srgb, var(--error) 22%, transparent);
    border-radius: 8px; padding: 10px 12px;
  }

  .reveal { display: grid; gap: 16px; text-align: center; }
  .reveal p { margin: 0; }
  .for-line { font-size: 15px; }
  .for-line b { font-weight: 600; }
  .recipient {
    font: 900 clamp(44px, 14vw, 64px)/1.05 var(--display);
    color: var(--accent);
    word-break: break-word;
  }
  .reveal.show .recipient { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { transform: scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }

  .people { display: grid; gap: 10px; text-align: center; }
  .people h2 {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .people ul {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  }
  .people li {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 15px; color: var(--accent-2); background: var(--accent-2-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal.show .recipient { animation: none; }
    button { transition: none; }
  }
</style>

<main>
  <header>
    <div class="eyebrow">Secret Santa · 神秘圣诞老人</div>
    <h1>Who's your person?</h1>
    <p class="sub">A fish looks at you<br>一只鱼在注视你</p>
  </header>

  <div class="tag-wrap">
    <div class="string" aria-hidden="true"></div>
    <div class="tag">
      <div class="tag-label">To / From</div>

      <form id="lookup" autocomplete="off" novalidate>
        <label for="name">Your name <span>/ 你的名字</span></label>
        <input id="name" name="name" type="text" spellcheck="false" autocapitalize="off">
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit">Reveal my person · 揭晓</button>
      </form>

      <div class="reveal" id="reveal" hidden aria-live="polite">
        <p class="for-line"><b id="giver"></b>, you're getting a gift for<br>你要送礼物给</p>
        <p class="recipient" id="recipient"></p>
        <button type="button" class="ghost" id="hide">Hide · 隐藏</button>
      </div>
    </div>
  </div>

  <section class="people" aria-labelledby="people-h">
    <h2 id="people-h">In this draw · 参与者</h2>
    <ul id="people"></ul>
  </section>

</main>

<script>
  // Drawn once in advance as a single loop: nobody gets themselves and no two people draw each other.
  const DRAW = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob("eyLlsI/pvpnomb4iOiAiVmFuIiwgIlZhbiI6ICLmtbfpuKEiLCAi5rW36bihIjogIueCuOmxvCIsICLngrjpsbwiOiAi6Jav5p2hIiwgIuiWr+adoSI6ICJPbGl2ZSIsICJPbGl2ZSI6ICLlsI/pvpnomb4ifQ=="), c => c.charCodeAt(0))));

  // Extra spellings accepted for a name (compared after normalizing).
  const ALIASES = {
    "小龙虾": ["龙虾", "小龙蟹"],
  };

  const normalize = s => s.normalize("NFKC").toLowerCase().replace(/\s+/g, "");

  const lookup = new Map();
  for (const name of Object.keys(DRAW)) {
    lookup.set(normalize(name), name);
    for (const alt of ALIASES[name] || []) lookup.set(normalize(alt), name);
  }

  const $ = id => document.getElementById(id);
  const form = $("lookup"), input = $("name"), error = $("error"), reveal = $("reveal");

  $("people").innerHTML = "";
  for (const name of Object.keys(DRAW).sort((a, b) => a.localeCompare(b))) {
    const li = document.createElement("li");
    li.textContent = name;
    $("people").append(li);
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const typed = input.value.trim();
    if (!typed) {
      error.textContent = "Type your name first. · 请先输入名字。";
      error.hidden = false;
      input.focus();
      return;
    }
    const me = lookup.get(normalize(typed));
    if (!me) {
      error.textContent = `We couldn't find "${typed}". Use one of the names listed below. · 找不到这个名字，请使用下面列出的名字。`;
      error.hidden = false;
      input.focus();
      return;
    }
    error.hidden = true;
    $("giver").textContent = me;
    $("recipient").textContent = DRAW[me];
    form.hidden = true;
    reveal.hidden = false;
    reveal.classList.remove("show");
    void reveal.offsetWidth;
    reveal.classList.add("show");
  });

  $("hide").addEventListener("click", () => {
    reveal.hidden = true;
    reveal.classList.remove("show");
    form.hidden = false;
    input.value = "";
    input.focus();
  });
</script>

</body>
</html>
